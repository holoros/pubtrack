# Tracked authors. Edit on GitHub (pencil icon) and commit: the refresh workflow runs on every
# change to this file, fetches anyone new, and redeploys the dashboard.
#
# id               short lowercase key (letters, digits, - or _); never change it once data exist
# name             as it should read in the dashboard and statements
# scholar_id       the value after user= in the Google Scholar profile URL (optional)
# orcid            used to look up openalex_id when that is blank
# openalex_id      A... id; comma separate several if OpenAlex split the person's record
# first_year       first publication year for academic age (0 = infer from the record)
# scholar_cadence  weekly | monthly | quarterly | never  (each Scholar refresh costs SerpAPI searches)
# group            free label; "self" sorts first
#
# A change to this file triggers a fetch on push (used on 26 October 2026 to backfill OpenAlex after the paging fix,
# and again the same day to apply the dataset and version rules of 0.2.3; a push that edits this file forces the OpenAlex pass;
# 27 October 2026 for the frozen inputs and year to date counts of 0.2.4).

settings:
  scholar_via: serpapi          # serpapi | scholarly (local machine only) | none
  # openalex_skip_types: [erratum, retraction, paratext, peer-review, grant, supplementary-materials, dataset, software, libguides, standard]
  serpapi_monthly_budget: 240   # free tier is 250 searches a month; failed and cached calls are free
  openalex_cadence: weekly

authors:
  - id: weiskittel
    name: Aaron R. Weiskittel
    surname: Weiskittel
    scholar_id: e7z1aLEAAAAJ
    orcid: 0000-0003-2534-4478
    openalex_id: A5011502228
    first_year: 0
    scholar_cadence: weekly
    group: self
