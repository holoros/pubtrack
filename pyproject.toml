[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubtrack"
version = "0.1.0"
description = "Weekly Google Scholar and OpenAlex citation snapshots with locally computed impact metrics"
requires-python = ">=3.11"
dependencies = [
  "scholarly>=1.7",
  "bibtexparser<2",   # scholarly imports the 1.x API
  "requests>=2.31",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pubtrack = "pubtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubtrack = ["schema.sql"]
